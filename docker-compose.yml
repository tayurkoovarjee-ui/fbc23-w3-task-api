services:
  db:
    image: postgres:16            # the official image
    environment:
      # Read from the .env file next to this one. The image uses them to create
      # the user and database the first time it starts.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # A named volume. The data lives outside the container, so it survives
      # restarts and "docker compose down". Only "down -v" deletes it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Asks Postgres if it is ready. $$ keeps Compose from replacing the
      # variable, so the container's own value is used.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .                      # build from the Dockerfile in this folder
    ports:
      - "8000:8000"               # your machine's port 8000 -> the container's 8000
    environment:
      # Inside Compose the database host is "db", the service name above.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}   # :-60 = default if unset
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        # Wait until the healthcheck passes, not just until the container starts.
        condition: service_healthy

volumes:
  pgdata:                         # declares the named volume used above
